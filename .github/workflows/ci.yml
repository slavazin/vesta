name: suite
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover engine/tests
      - run: python tools/neutrality.py
      - name: A release tag names the engine's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python tools/release.py --tag "${GITHUB_REF_NAME}"
